name: bindings-erlang-release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build artifacts under (defaults to erlang-v<version> from rockbox_ffi_nif.app.src)
        type: string
        required: false
  push:
    tags:
      - erlang-v*
permissions:
  contents: write
env:
  OTP_VERSION: '27'
  WORKDIR: bindings/erlang
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER="$(sed -n 's/.*{vsn, *"\([^"]*\)".*/\1/p' "$WORKDIR/src/rockbox_ffi_nif.app.src" | head -1)"
            [ -n "$VER" ] || { echo "could not read {vsn, ...} from rockbox_ffi_nif.app.src" >&2; exit 1; }
            TAG="erlang-v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"
      - name: Ensure release exists (auto-creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Precompiled rockbox_ffi_nif NIFs ($TAG)" \
              --notes "Multi-arch rockbox_ffi_nif .so files for the Elixir + Gleam bindings. Managed by bindings-erlang-release.yml." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
  build:
    needs: prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
        if: runner.os == 'Linux'
      - name: Run nif with Dagger
        env:
          CI_JOB: nif
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TARGET: ${{ matrix.target }}
        run: bash .dagger/ci.sh "$CI_JOB"
        if: runner.os == 'Linux'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os != 'Linux'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
        if: runner.os != 'Linux'
      - name: Build NIF (${{ matrix.target }})
        working-directory: ${{ env.WORKDIR }}
        run: make TARGET=${{ matrix.target }}
        if: runner.os != 'Linux'
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-${{ matrix.target }}.so" --clobber
  build-freebsd:
    needs: prepare-release
    name: build (x86_64-unknown-freebsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build NIF in FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: '15.1'
          architecture: x86_64
          shell: sh
          run: |
            set -eux
            sudo pkg install -y rust erlang-runtime27 alsa-lib dbus gcc pkgconf gmake
            export PATH="/usr/local/lib/erlang27/bin:$PATH"
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols
            cd bindings/erlang
            gmake TARGET=x86_64-unknown-freebsd
            ls -l priv
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-x86_64-unknown-freebsd.so" --clobber
  build-netbsd:
    needs: prepare-release
    name: build (x86_64-unknown-netbsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build NIF in NetBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: '10.1'
          architecture: x86_64
          shell: sh
          run: "set -eux\n# gcc is not in pkgin \u2014 NetBSD's base system ships gcc/g++ + libstdc++.\nsudo pkgin -y install\
            \ rust erlang alsa-lib dbus pkgconf gmake\nexport CARGO_PROFILE_RELEASE_DEBUG=0\nexport CARGO_PROFILE_RELEASE_STRIP=symbols\n\
            cd bindings/erlang\ngmake TARGET=x86_64-unknown-netbsd\nls -l priv\n"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-x86_64-unknown-netbsd.so" --clobber
