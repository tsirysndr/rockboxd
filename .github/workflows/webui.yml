name: webui
'on':
  push:
    branches:
      - master
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Run web-test with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci web-test --source "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE" --platform "linux/amd64"
    defaults:
      run:
        shell: bash
