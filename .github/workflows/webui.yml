name: webui
'on':
  push:
    branches:
      - master
  pull_request: null
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run web-test with Dagger
        run: bash .dagger/ci.sh web-test
