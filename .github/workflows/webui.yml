name: webui
'on':
  push:
    branches:
      - master
  pull_request: null
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run web-test with Dagger
        run: dagger --progress logs -v api call -m .dagger/ci web-test --source . export --path .
