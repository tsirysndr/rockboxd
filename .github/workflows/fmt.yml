name: cargo-fmt
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run format with Dagger
        run: dagger api call -m .dagger/ci format --source . export --path .
