name: bindings-go-test
'on':
  push:
    paths:
      - bindings/go/**
      - crates/rockbox-ffi/**
      - include/rockbox_ffi.h
      - .github/workflows/bindings-go-test.yml
      - .dagger/**
      - dagger.toml
      - mise.toml
      - .github/actions/setup-dagger/**
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  pull_request:
    paths:
      - bindings/go/**
      - crates/rockbox-ffi/**
      - include/rockbox_ffi.h
      - .github/workflows/bindings-go-test.yml
      - .dagger/**
      - dagger.toml
      - mise.toml
      - .github/actions/setup-dagger/**
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  workflow_dispatch:
jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
        if: runner.os == 'Linux'
      - name: Run go-test with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","go-test","--source",".","--platform","$PLATFORM","export","--path","."]'
        if: runner.os == 'Linux'
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Set up go
        run: fluentci run setup-go setup --version 1.26.2 | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Build librockbox_ffi
        run: cargo build --release -p rockbox-ffi
        if: runner.os != 'Linux'
      - name: go vet
        working-directory: bindings/go
        run: go vet -unsafeptr=false ./...
        if: runner.os != 'Linux'
      - name: go test
        working-directory: bindings/go
        run: go test -v ./...
        if: runner.os != 'Linux'
    defaults:
      run:
        shell: bash
