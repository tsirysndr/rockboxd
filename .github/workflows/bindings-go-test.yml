name: bindings-go-test
'on':
  push:
    paths:
      - bindings/go/**
      - crates/rockbox-ffi/**
      - include/rockbox_ffi.h
      - .github/workflows/bindings-go-test.yml
      - .dagger/**
      - dagger.toml
      - mise.toml
      - .github/actions/setup-dagger/**
  pull_request:
    paths:
      - bindings/go/**
      - crates/rockbox-ffi/**
      - include/rockbox_ffi.h
      - .github/workflows/bindings-go-test.yml
      - .dagger/**
      - dagger.toml
      - mise.toml
      - .github/actions/setup-dagger/**
  workflow_dispatch: null
jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
        if: runner.os == 'Linux'
      - name: Run go-test with Dagger
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: dagger --progress logs -v api call -m .dagger/ci go-test --source . --platform "$PLATFORM" export --path .
        if: runner.os == 'Linux'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os != 'Linux'
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache-dependency-path: bindings/go/go.sum
        if: runner.os != 'Linux'
      - name: Build librockbox_ffi
        run: cargo build --release -p rockbox-ffi
        if: runner.os != 'Linux'
      - name: go vet
        working-directory: bindings/go
        run: go vet -unsafeptr=false ./...
        if: runner.os != 'Linux'
      - name: go test
        working-directory: bindings/go
        run: go test -v ./...
        if: runner.os != 'Linux'
