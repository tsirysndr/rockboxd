name: Dagger module checks
on:
  push:
    paths:
      - '.dagger/**'
      - '.github/**'
      - 'dagger.toml'
      - 'mise.toml'
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  pull_request:
    paths:
      - '.dagger/**'
      - '.github/**'
      - 'dagger.toml'
      - 'mise.toml'
      - .fluentci/**
      - fluentci.toml
      - .github/actions/fluentci-toolchain/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up node
        run: fluentci run setup-node setup --version 24.11.1 | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable --components rustfmt | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Compile the module without an engine
        working-directory: .dagger/ci
        run: |
          spago build -p rockbox-ci --pedantic-packages
          node --test checks/*.test.mjs
      - name: Compile standalone release modules without an engine
        run: python3 .dagger/check-modules.py
      - name: Set up uv
        run: fluentci run setup-uv setup | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Configure managed Python
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci python --version 3.12
      - run: pip install PyYAML==6.0.3
      - name: Check FluentCI workflow contracts
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci check --directory "$GITHUB_WORKSPACE"
      - name: Set up go
        run: fluentci run setup-go setup --version 1.26.2 | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml
    defaults:
      run:
        shell: bash
