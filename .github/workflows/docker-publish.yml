name: Publish Docker Image
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version / image tag (e.g. 1.2.3 or latest)
        required: false
        default: latest
env:
  GHCR_IMAGE: ghcr.io/tsirysndr/rockbox
  DOCKERHUB_IMAGE: tsiry/rockbox
  TAG: ${{ github.event.inputs.version }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-dagger
      - name: Build multi-platform image with Dagger
        run: dagger api call -m .dagger/ci image --source . --tag "$TAG" export --path rockbox-image.tar
      - name: Publish OCI image to both registries
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "$TAG" latest; do
              skopeo copy --all --authfile "$HOME/.docker/config.json" \
                oci-archive:rockbox-image.tar "docker://$image:$tag"
            done
          done
