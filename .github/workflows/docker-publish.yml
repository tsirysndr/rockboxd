name: Publish Docker Image
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version / image tag (e.g. 1.2.3 or latest)
        required: false
        default: latest
env:
  GHCR_IMAGE: ghcr.io/tsirysndr/rockbox
  DOCKERHUB_IMAGE: tsiry/rockbox
  TAG: ${{ github.event.inputs.version }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
      - name: Build multi-platform image with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","image","--source",".","--tag","$TAG","export","--path","rockbox-image.tar"]'
      - name: Publish OCI image to both registries
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "$TAG" latest; do
              skopeo copy --all --authfile "$HOME/.docker/config.json" \
                oci-archive:rockbox-image.tar "docker://$image:$tag"
            done
          done
    defaults:
      run:
        shell: bash
