name: release embed lib

# Builds librockboxd.a (headless/cpal fat static archive) for macOS and Linux
# and uploads each platform archive to the GitHub release.
#
# Contents of each archive:
#   lib/librockboxd.a   — fat static archive (firmware + codecs + Rust servers)
#   include/rockboxd.h  — public C/Swift/Rust FFI header
#
# Consumers link with:
#   macOS: -framework CoreAudio -framework AudioUnit -framework AudioToolbox
#          -framework CoreFoundation -framework Security
#   Linux: -lasound -lunwind -ldbus-1

on:
  push:
    tags-ignore:
      - "clojure-v*"
      - "clojure-ffi-v*"
      - "bindings-v*"
      - "elixir-v*"
      - "gleam-v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the library to"
        type: string
        required: true

jobs:
  build:
    name: build (${{ matrix.arch }}-${{ matrix.os_label }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            os_label: darwin
          - runner: macos-15-intel
            arch: x86_64
            os_label: darwin
            zig_cpu: "-Dcpu=x86_64"
            rust_flags: "-C target-cpu=x86-64 -A warnings"
          - runner: ubuntu-latest
            arch: x86_64
            os_label: linux
            zig_cpu: "-Dcpu=x86_64"
            rust_flags: "-C target-cpu=x86-64 -A warnings"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            os_label: linux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zig/.zig-cache
            target
          key: embed-lib-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: embed-lib-${{ matrix.runner }}-${{ matrix.arch }}-

      # ── macOS dependencies ────────────────────────────────────────────────
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # llvm@22 crashes in setSymbolInRelocationInfo on Mach-O — use llvm@21
          brew install llvm@21 cmake protobuf
          echo "/opt/homebrew/opt/llvm@21/bin:/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH

      # ── Linux dependencies ────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libunwind-dev \
            libasound2-dev \
            libdbus-1-dev \
            protobuf-compiler \
            cmake

      # ── Rust flags ────────────────────────────────────────────────────────
      - name: Set Rust flags
        run: |
          FLAGS="${{ matrix.rust_flags || '-A warnings' }}"
          echo "RUSTFLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile

      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: bun run build

      # ── Step 1-2: Headless firmware + rockbox-server ──────────────────────
      # build-headless.sh configures build-headless/, builds firmware .a files,
      # extracts codec objects, and builds librockbox_cli.a + librockbox_server.a
      - name: Build headless firmware
        run: bash scripts/build-headless.sh

      # ── Step 3: rockbox-embed Rust crate ──────────────────────────────────
      - name: Build rockbox-embed
        # Remove the cached static archive so cargo always re-links it from the
        # current target/release/deps. The cache key only hashes Cargo.lock and
        # `restore-keys` falls back to any prior embed-lib-${{ matrix.runner }}-
        # ${{ matrix.arch }}- cache, so a crates/embed-only change can otherwise
        # restore a stale .a missing newer exports (e.g. rb_daemon_start).
        # Mirrors the release-gpui / linux-x86_64-build force-relink step.
        run: |
          rm -f target/release/librockbox_embed.a
          cargo build --release -p rockbox-embed
          echo "--- verify rb_daemon_start is present ---"
          nm --defined-only target/release/librockbox_embed.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockbox_embed.a — abort"; exit 1; }

      # ── Step 4: Zig lib step ──────────────────────────────────────────────
      - name: Build librockboxd.a
        run: |
          rm -f zig/zig-out/lib/librockboxd.a
          cd zig
          zig build lib -Doptimize=ReleaseFast ${{ matrix.zig_cpu }}
          cd ..
          echo "--- verify rb_daemon_start survived into librockboxd.a ---"
          nm --defined-only zig/zig-out/lib/librockboxd.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockboxd.a — abort"; exit 1; }

      - name: Clean build artifacts
        run: |
          cp zig/zig-out/lib/librockboxd.a /tmp/librockboxd.a
          rm -rf target build-lib build-headless zig/.zig-cache
          mkdir -p zig/zig-out/lib
          mv /tmp/librockboxd.a zig/zig-out/lib/librockboxd.a

      # ── Package ───────────────────────────────────────────────────────────
      - name: Resolve version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          ARCH="${{ matrix.arch }}"
          OS="${{ matrix.os_label }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=librockboxd_${VERSION}_${ARCH}-${OS}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package archive
        run: |
          mkdir -p dist/lib dist/include
          cp zig/zig-out/lib/librockboxd.a dist/lib/
          cp include/rockboxd.h             dist/include/
          ARCHIVE="${{ steps.vars.outputs.archive }}"
          tar -C dist -czf "$ARCHIVE" lib include
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "Archive contents:"
          tar -tzf "$ARCHIVE"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.vars.outputs.archive }}
            ${{ steps.vars.outputs.archive }}.sha256
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
