name: release embed lib
'on':
  push:
    tags-ignore:
      - clojure-v*
      - clojure-ffi-v*
      - bindings-v*
      - erlang-v*
      - gleam-v*
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the library to
        type: string
        required: true
jobs:
  build:
    name: build (${{ matrix.arch }}-${{ matrix.os_label }})
    if: |-
      github.event_name == 'workflow_dispatch' || (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            os_label: darwin
          - runner: macos-15-intel
            arch: x86_64
            os_label: darwin
            zig_cpu: -Dcpu=x86_64
            rust_flags: -C target-cpu=x86-64 -A warnings
          - runner: ubuntu-latest
            arch: x86_64
            os_label: linux
            zig_cpu: -Dcpu=x86_64
            rust_flags: -C target-cpu=x86-64 -A warnings
          - runner: ubuntu-24.04-arm
            arch: aarch64
            os_label: linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          ARCH="${{ matrix.arch }}"
          OS="${{ matrix.os_label }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "archive=librockboxd_${VERSION}_${ARCH}-${OS}.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-dagger
        if: runner.os == 'Linux'
      - name: Run embed with Dagger
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TAG: ${{ steps.vars.outputs.version }}
        run: dagger --progress logs -v api call -m .dagger/ci embed --source . --platform "$PLATFORM" --tag "$TAG" export --path .
        if: runner.os == 'Linux'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
        if: runner.os != 'Linux'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os != 'Linux'
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zig/.zig-cache
            target
          key: embed-lib-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: embed-lib-${{ matrix.runner }}-${{ matrix.arch }}-
        if: runner.os != 'Linux'
      - name: Install macOS dependencies
        if: runner.os != 'Linux' && (runner.os == 'macOS')
        run: "# llvm@22 crashes in setSymbolInRelocationInfo on Mach-O \u2014 use llvm@21\nbrew install llvm@21 cmake protobuf\n\
          echo \"/opt/homebrew/opt/llvm@21/bin:/usr/local/opt/llvm@21/bin\" >> $GITHUB_PATH\n"
      - name: Set Rust flags
        run: |
          FLAGS="${{ matrix.rust_flags || '-A warnings' }}"
          echo "RUSTFLAGS=$FLAGS" >> $GITHUB_ENV
        if: runner.os != 'Linux'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
        if: runner.os != 'Linux'
      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build
        if: runner.os != 'Linux'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        if: runner.os != 'Linux'
      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile
        if: runner.os != 'Linux'
      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: bun run build
        if: runner.os != 'Linux'
      - name: Build headless firmware
        run: bash scripts/build-headless.sh
        if: runner.os != 'Linux'
      - name: Build rockbox-embed
        run: "rm -f target/release/librockbox_embed.a\ncargo build --release -p rockbox-embed\necho \"--- verify rb_daemon_start\
          \ is present ---\"\nnm --defined-only target/release/librockbox_embed.a 2>/dev/null \\\n  | grep rb_daemon_start\
          \ \\\n  || { echo \"rb_daemon_start NOT in librockbox_embed.a \u2014 abort\"; exit 1; }\n"
        if: runner.os != 'Linux'
      - name: Build librockboxd.a
        run: "rm -f zig/zig-out/lib/librockboxd.a\ncd zig\nzig build lib -Doptimize=ReleaseFast ${{ matrix.zig_cpu }}\ncd\
          \ ..\necho \"--- verify rb_daemon_start survived into librockboxd.a ---\"\nnm --defined-only zig/zig-out/lib/librockboxd.a\
          \ 2>/dev/null \\\n  | grep rb_daemon_start \\\n  || { echo \"rb_daemon_start NOT in librockboxd.a \u2014 abort\"\
          ; exit 1; }\n"
        if: runner.os != 'Linux'
      - name: Clean build artifacts
        run: |
          cp zig/zig-out/lib/librockboxd.a /tmp/librockboxd.a
          rm -rf target build-lib build-headless zig/.zig-cache
          mkdir -p zig/zig-out/lib
          mv /tmp/librockboxd.a zig/zig-out/lib/librockboxd.a
        if: runner.os != 'Linux'
      - name: Package archive
        run: |
          mkdir -p dist/lib dist/include
          cp zig/zig-out/lib/librockboxd.a dist/lib/
          cp include/rockboxd.h             dist/include/
          ARCHIVE="${{ steps.vars.outputs.archive }}"
          tar -C dist -czf "$ARCHIVE" lib include
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "Archive contents:"
          tar -tzf "$ARCHIVE"
        if: runner.os != 'Linux'
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.vars.outputs.archive }}
            ${{ steps.vars.outputs.archive }}.sha256
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
