# Builds the multi-arch precompiled NIF binaries for the `rockbox_ffi` Gleam
# package and uploads them to a per-version GitHub release. It does NOT publish
# to Hex.
#
# Gleam has NO compile step at `gleam add` time, so the package can't build or
# download native code on the consumer. Instead it ships ONE prebuilt .so per
# platform under priv/, named rockbox_ffi_nif-<target>.so; the Erlang loader
# (src/rockbox_ffi_nif.erl) detects the host triple and loads the matching one.
#
# This workflow builds each .so on a native runner (the Rust static archive is
# arch-specific) and uploads them to the release for tag `gleam-v<version>`,
# which is AUTO-CREATED from gleam.toml (override with the `tag` dispatch input,
# or push a `gleam-v*` tag).
#
# Hex publishing is done LOCALLY (Hex 2FA is interactive and can't run in CI):
# after this workflow finishes, run `bindings/scripts/publish-gleam.sh`, which
# downloads these .so files into priv/ and then runs `gleam publish`.

name: bindings-gleam-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build artifacts under (defaults to gleam-v<version> from gleam.toml)"
        type: string
        required: false
  push:
    tags:
      - "gleam-v*"

permissions:
  contents: write

env:
  OTP_VERSION: "27"
  WORKDIR: bindings/gleam

jobs:
  # Resolve the release tag and auto-create the release/tag before the matrix
  # uploads to it (also avoids a create-race between concurrent build jobs).
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER="$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$WORKDIR/gleam.toml" | head -1)"
            [ -n "$VER" ] || { echo "could not read version from gleam.toml" >&2; exit 1; }
            TAG="gleam-v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Ensure release exists (auto-creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Precompiled Gleam NIFs ($TAG)" \
              --notes "Multi-arch rockbox_ffi_nif .so files for the Gleam package. Managed by bindings-gleam-release.yml." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

  build:
    needs: prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libunwind-dev libdbus-1-dev pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # erl is needed by the Makefile to locate the ERTS include dir.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}

      - name: Build NIF (${{ matrix.target }})
        working-directory: ${{ env.WORKDIR }}
        run: make TARGET=${{ matrix.target }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-${{ matrix.target }}.so" --clobber

  # FreeBSD amd64 — best-effort, built in a cross-platform-actions VM.
  build-freebsd:
    needs: prepare-release
    name: build (x86_64-unknown-freebsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build NIF in FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: "15.1"
          architecture: x86_64
          shell: sh
          run: |
            set -eux
            sudo pkg install -y rust erlang-runtime27 alsa-lib dbus gcc pkgconf gmake
            export PATH="/usr/local/lib/erlang27/bin:$PATH"
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols
            cd bindings/gleam
            gmake TARGET=x86_64-unknown-freebsd
            ls -l priv

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-x86_64-unknown-freebsd.so" --clobber

  # NetBSD amd64 — best-effort (see FreeBSD job notes).
  build-netbsd:
    needs: prepare-release
    name: build (x86_64-unknown-netbsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build NIF in NetBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: "10.1"
          architecture: x86_64
          shell: sh
          run: |
            set -eux
            # gcc is not in pkgin — NetBSD's base system ships gcc/g++ + libstdc++.
            sudo pkgin -y install rust erlang alsa-lib dbus pkgconf gmake
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols
            cd bindings/gleam
            gmake TARGET=x86_64-unknown-netbsd
            ls -l priv

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "$WORKDIR/priv/rockbox_ffi_nif-x86_64-unknown-netbsd.so" --clobber
