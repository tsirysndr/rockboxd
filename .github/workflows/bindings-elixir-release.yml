# Builds the PRECOMPILED NIF binaries for `rockbox_ex_ffi` and uploads them to a
# rolling GitHub release. It does NOT publish to Hex.
#
# Consumers of the Hex package never build from source (they have no Cargo
# workspace and the 30 MB static archive isn't shipped). Instead elixir_make +
# cc_precompiler download a prebuilt `priv/rockbox_ffi_nif.so` matching their
# OS/arch. This workflow builds those .so's — one per native runner, since the
# Rust static archive `librockbox_ffi.a` is arch-specific and can't be
# cross-tarred — and uploads them to a single rolling GitHub release.
#
# Hex publishing is done LOCALLY (Hex 2FA/OTP is interactive and can't run in
# CI): after this workflow finishes, run `bindings/scripts/publish-elixir.sh`,
# which downloads these artifacts to generate checksum.exs and then publishes.

name: bindings-elixir-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New elixir-v* tag to create at the current commit (e.g. elixir-v0.4.1)"
        type: string
        required: true
  push:
    tags:
      - "elixir-v*"

permissions:
  contents: write

env:
  # OTP 26/27/28 all report NIF version 2.17, which is what mix.exs targets.
  # NOTE: the Linux .so inherits ubuntu-latest's glibc floor — consumers on an
  # older glibc than the runner must build from source (ROCKBOX_FFI_BUILD=1).
  OTP_VERSION: "27"
  ELIXIR_VERSION: "1.17"
  PRECOMPILED_TAG: rockbox-ffi-nif
  WORKDIR: bindings/elixir

jobs:
  # Ensure the rolling release exists before the matrix uploads to it (avoids a
  # create-race between concurrent matrix jobs).
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On manual dispatch, create the requested tag at the checked-out commit
      # if it doesn't already exist. Uses the GitHub API with GITHUB_TOKEN, which
      # (by design) does NOT re-trigger the push-tag event, so there's no loop.
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — leaving it untouched."
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="${{ github.sha }}"
            echo "Created tag $TAG at ${{ github.sha }}."
          fi

      - name: Ensure rolling release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$PRECOMPILED_TAG" >/dev/null 2>&1; then
            gh release create "$PRECOMPILED_TAG" \
              --title "Precompiled Elixir NIFs (rockbox_ex_ffi)" \
              --notes "Rolling release hosting precompiled rockbox_ffi_nif artifacts for every published version. Managed by bindings-elixir-release.yml." \
              --prerelease
          fi

  precompile:
    needs: prepare-release
    name: precompile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-linux-gnu
            os: ubuntu-latest
          - target: aarch64-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The NIF link step needs alsa/unwind/dbus dev libs (Makefile LDFLAGS);
      # the cargo build needs alsa + pkg-config.
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libunwind-dev libdbus-1-dev pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Build librockbox_ffi.a
        run: cargo build --release -p rockbox-ffi

      - name: Precompile NIF (native target only)
        working-directory: ${{ env.WORKDIR }}
        env:
          MIX_ENV: prod
          # Together with `only_listed_targets: true` in mix.exs, this collapses
          # the compile set to exactly this runner's native target.
          CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL: "true"
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix elixir_make.precompile

      - name: Stage artifact
        working-directory: ${{ env.WORKDIR }}
        run: |
          mkdir -p dist
          # elixir_make caches the tarball under the OS user-cache dir.
          find "$HOME/.cache/elixir_make" "$HOME/Library/Caches/elixir_make" \
            -name '*.tar.gz' -exec cp {} dist/ \; 2>/dev/null || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nif-${{ matrix.target }}
          path: ${{ env.WORKDIR }}/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$PRECOMPILED_TAG" ${{ env.WORKDIR }}/dist/*.tar.gz --clobber

  # FreeBSD amd64 — best-effort, built in a cross-platform-actions VM (no native
  # GitHub runner). The whole build runs inside the guest; cross-platform-actions
  # rsyncs the working directory in and back out, so the staged tarball under
  # bindings/elixir/dist is available on the host for the upload step. The
  # canonical triple is pinned via TARGET_* so the artifact name is stable across
  # FreeBSD releases; MAKE=gmake because the Makefile is GNU-make syntax.
  precompile-freebsd:
    needs: prepare-release
    name: precompile (x86_64-unknown-freebsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + precompile in FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          version: "15.1"
          architecture: x86_64
          shell: sh
          run: |
            set -eux
            # alsa-lib + dbus are runtime link deps; gcc provides the C++
            # toolchain (g++/libstdc++) the NIF link step needs.
            sudo pkg install -y rust erlang-runtime28 elixir alsa-lib dbus gcc pkgconf gmake
            # erlang-runtime28 installs its binaries under erlang28/bin and does
            # not add them to PATH; prepend it so erl/mix find the runtime.
            export PATH="/usr/local/lib/erlang28/bin:$PATH"
            export MAKE=gmake MIX_ENV=prod CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL=true
            export TARGET_ARCH=x86_64 TARGET_OS=unknown TARGET_ABI=freebsd
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols
            cd bindings/elixir
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            mix elixir_make.precompile
            mkdir -p dist
            find "$HOME" -name 'rockbox_ex_ffi-*.tar.gz' -exec cp {} dist/ \;
            ls -l dist

      - name: Upload to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$PRECOMPILED_TAG" ${{ env.WORKDIR }}/dist/*.tar.gz --clobber

  # NetBSD amd64 — best-effort (see FreeBSD job notes). pkgin ships in the
  # cross-platform-actions NetBSD image.
  precompile-netbsd:
    needs: prepare-release
    name: precompile (x86_64-unknown-netbsd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Free up host disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + precompile in NetBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: netbsd
          version: "10.1"
          architecture: x86_64
          shell: sh
          run: |
            set -eux
            # alsa-lib + dbus are runtime link deps. gcc is not in the pkgin
            # repository — NetBSD's base system already ships gcc/g++ + libstdc++.
            sudo pkgin -y install rust erlang elixir alsa-lib dbus pkgconf gmake
            export MAKE=gmake MIX_ENV=prod CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL=true
            export TARGET_ARCH=x86_64 TARGET_OS=unknown TARGET_ABI=netbsd
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols
            cd bindings/elixir
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            mix elixir_make.precompile
            mkdir -p dist
            find "$HOME" -name 'rockbox_ex_ffi-*.tar.gz' -exec cp {} dist/ \;
            ls -l dist

      - name: Upload to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$PRECOMPILED_TAG" ${{ env.WORKDIR }}/dist/*.tar.gz --clobber

  # No Hex publish job: Hex 2FA/OTP is interactive and can't run in CI. Once the
  # precompile jobs above have uploaded every target's tarball to the rolling
  # release, publish from a workstation with:
  #   bindings/scripts/publish-elixir.sh
  # which downloads those artifacts to build checksum.exs and then runs
  # `mix hex.publish` interactively.
