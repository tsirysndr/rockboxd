name: linux-aarch64-check
'on':
  push:
    branches:
      - '**'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Run linux-aarch64-check with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci linux-check --source "$GITHUB_WORKSPACE" --platform "$PLATFORM" --output "$GITHUB_WORKSPACE"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-linux-aarch64
          path: |
            target/release/rockbox
            zig/zig-out/bin/rockboxd
    defaults:
      run:
        shell: bash
