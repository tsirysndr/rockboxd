name: linux-aarch64-check
'on':
  push:
    branches:
      - '**'
  pull_request: null
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run linux-aarch64-check with Dagger
        env:
          CI_JOB: linux-aarch64-check
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: bash .dagger/ci.sh "$CI_JOB"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-linux-aarch64
          path: |
            target/release/rockbox
            zig/zig-out/bin/rockboxd
