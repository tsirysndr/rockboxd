name: android-apk
'on':
  workflow_dispatch:
    inputs:
      features:
        description: Cargo features for rockbox-expo cdylib (space-separated)
        default: embedded-daemon
        required: false
        type: string
      architectures:
        description: React Native architectures to include in the APK
        default: arm64-v8a
        required: false
        type: string
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
      - name: Run android-apk with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          FEATURES: ${{ inputs.features }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","android-apk","--source",".","--platform","$PLATFORM","--android-sdk","$ANDROID_SDK_ROOT","--features","$FEATURES","--architectures","$ARCHITECTURES","export","--path","."]'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-android-apk-${{ github.run_number }}
          path: expo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
    defaults:
      run:
        shell: bash
