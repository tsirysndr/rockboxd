name: nix-consume
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Flake reference to install
        type: string
        required: false
        default: git+https://github.com/tsirysndr/rockboxd?submodules=1
jobs:
  install:
    name: nix profile add (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
        if: runner.os == 'Linux'
      - name: Consume published flake with FluentCI
        if: runner.os == 'Linux'
        env:
          FLAKE_REF: ${{ inputs.ref }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","nix-consume","--ref","$FLAKE_REF"]'
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Configure Cachix with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation setup --cache rockbox
        env:
          CACHIX_AUTH_TOKEN: ''
        if: runner.os != 'Linux'
      - name: nix profile add ${{ inputs.ref }}
        run: nix profile add --print-build-logs "${{ inputs.ref }}"
        if: runner.os != 'Linux'
      - name: Verify rockboxd is installed
        run: |
          nix profile list
          ls -l ~/.nix-profile/bin/rockboxd
          command -v rockboxd
        if: runner.os != 'Linux'
    defaults:
      run:
        shell: bash
