name: nix-consume
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Flake reference to install
        type: string
        required: false
        default: git+https://github.com/tsirysndr/rockboxd?submodules=1
jobs:
  install:
    name: nix profile add (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-dagger
        if: runner.os == 'Linux'
      - name: Consume published flake with Dagger
        if: runner.os == 'Linux'
        env:
          FLAKE_REF: ${{ inputs.ref }}
        run: dagger api call -m .dagger/ci nix-consume --ref "$FLAKE_REF"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
        if: runner.os != 'Linux'
      - name: Setup Cachix (read-only)
        uses: cachix/cachix-action@v17
        with:
          name: rockbox
          skipPush: true
        if: runner.os != 'Linux'
      - name: nix profile add ${{ inputs.ref }}
        run: nix profile add --print-build-logs "${{ inputs.ref }}"
        if: runner.os != 'Linux'
      - name: Verify rockboxd is installed
        run: |
          nix profile list
          ls -l ~/.nix-profile/bin/rockboxd
          command -v rockboxd
        if: runner.os != 'Linux'
