name: android-aarch64-check
'on':
  push:
    branches:
      - '**'
  pull_request: null
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run android-check with Dagger
        env:
          CI_JOB: android-check
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: bash .dagger/ci.sh "$CI_JOB"
