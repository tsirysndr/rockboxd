name: android-aarch64-check
'on':
  push:
    branches:
      - '**'
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Run android-check with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci android-check --source "$GITHUB_WORKSPACE" --platform "$PLATFORM" --android-sdk "$ANDROID_SDK_ROOT" --output "$GITHUB_WORKSPACE"
    defaults:
      run:
        shell: bash
