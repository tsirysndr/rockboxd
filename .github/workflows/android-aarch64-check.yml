name: android-aarch64-check
'on':
  push:
    branches:
      - '**'
  pull_request: null
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run android-check with Dagger
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: dagger --progress logs -v api call -m .dagger/ci android-check --source . --platform "$PLATFORM" --android-sdk "$ANDROID_SDK_ROOT"
          export --path .
