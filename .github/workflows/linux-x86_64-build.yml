name: linux-x86_64-build
'on':
  push:
    tags-ignore:
      - clojure-v*
      - clojure-ffi-v*
      - bindings-v*
      - erlang-v*
      - gleam-v*
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish
        type: string
        required: true
env:
  TYPESENSE_VERSION: '30.1'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Determine version
        id: vars
        run: |
          echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
      - uses: ./.github/actions/setup-dagger
      - name: Run linux-x86_64-release with Dagger
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TAG: ${{ steps.vars.outputs.version }}
        run: dagger --progress logs -v api call -m .dagger/ci linux-release --source . --platform "$PLATFORM" --tag "$TAG" export --path artifacts/release
      - name: Ensure GitHub release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets with Dagger
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/release/*)
          args=()
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            args+=(--files "${file#artifacts/release/}")
          done
          ((${#args[@]} > 0)) || { echo "No release assets found" >&2; exit 1; }
          dagger --progress logs -v api call -m .dagger/modules/github-assets upload \
            --assets artifacts/release "${args[@]}" --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --token env:GH_TOKEN --clobber \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
      - name: Check Gemfury secrets
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "${FURY_TOKEN:-}" ] && [ -n "${FURY_ACCOUNT:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping push"
          fi
      - name: Push .deb and .rpm to Gemfury
        if: steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/release/*.deb artifacts/release/*.rpm)
          args=()
          for file in "${files[@]}"; do
            args+=(--files "${file#artifacts/release/}")
          done
          ((${#args[@]} > 0)) || { echo "No packages found" >&2; exit 1; }
          dagger --progress logs -v api call -m .dagger/modules/gemfury upload \
            --packages artifacts/release "${args[@]}" --account "$FURY_ACCOUNT" \
            --token env:FURY_TOKEN --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
