name: android-release
'on':
  release:
    types:
      - published
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -A warnings
jobs:
  build:
    if: |-
      github.event_name == 'workflow_dispatch' || (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run android-release with Dagger
        env:
          CI_JOB: android-release
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: bash .dagger/ci.sh "$CI_JOB"
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: expo/android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
