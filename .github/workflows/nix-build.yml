name: nix-build
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Flake attribute to build (e.g. .#rockboxd, .#webui-assets, .#s3webui-assets)
        type: string
        required: false
        default: .#rockboxd
jobs:
  build:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Rust static libraries with FluentCI
        env:
          FLAKE_TARGET: .#rockbox-rustlibs
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci nix-build --source "$GITHUB_WORKSPACE" --target "$FLAKE_TARGET" --cache rockbox
      - name: Requested flake attribute with FluentCI
        env:
          FLAKE_TARGET: ${{ inputs.target || '.#rockboxd' }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci nix-build --source "$GITHUB_WORKSPACE" --target "$FLAKE_TARGET" --cache rockbox
    defaults:
      run:
        shell: bash
