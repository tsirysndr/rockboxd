name: nix-build
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Flake attribute to build (e.g. .#rockboxd, .#webui-assets, .#s3webui-assets)
        type: string
        required: false
        default: .#rockboxd
jobs:
  build:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Configure Cachix with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation setup --cache rockbox
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
        if: runner.os == 'Linux'
      - name: nix flake show
        run: nix flake show
        if: runner.os != 'Linux'
      - name: nix build .#rockbox-rustlibs
        run: nix build --print-build-logs ".#rockbox-rustlibs"
        if: runner.os != 'Linux'
      - name: nix build ${{ inputs.target }}
        run: "target=\"${{ inputs.target }}\"\nif out=$(nix eval --raw \"${target}.drvPath\" 2>&1); then\n  nix build --print-build-logs \"$target\"\nelif grep -q \"does not provide attribute\" <<< \"$out\"; then\n  echo \"==> $target is not packaged for this system — skipping.\"\nelse\n  echo \"$out\" >&2\n  exit 1\nfi\n"
        if: runner.os != 'Linux'
      - name: Rust static libraries with FluentCI
        if: runner.os == 'Linux'
        env:
          FLAKE_TARGET: .#rockbox-rustlibs
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","nix-build","--source",".","--target","$FLAKE_TARGET","export","--path","artifacts/nix-rustlibs"]'
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci import-nix --directory "$GITHUB_WORKSPACE/artifacts/nix-rustlibs" --cache rockbox
      - name: Requested flake attribute with FluentCI
        if: runner.os == 'Linux'
        env:
          FLAKE_TARGET: ${{ inputs.target }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |-
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","nix-build","--source",".","--target","$FLAKE_TARGET","export","--path","artifacts/nix-target"]'
          fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci import-nix --directory "$GITHUB_WORKSPACE/artifacts/nix-target" --cache rockbox
      - name: Push result to Cachix
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation push --cache rockbox
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        if: runner.os == 'macOS'
    defaults:
      run:
        shell: bash
