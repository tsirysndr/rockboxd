name: release slint desktop app
'on':
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the archives to
        type: string
        required: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: |-
      github.event_name == 'workflow_dispatch' || (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'erlang-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # macOS ships a double-clickable .app inside a .dmg (that is what the
          # homebrew-tap cask installs); Linux ships the binary in a tarball.
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "archive=Rockbox-${VERSION}-${{ matrix.target }}.dmg" >> "$GITHUB_OUTPUT"
          else
            echo "archive=rockbox-desktop-${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-dagger
        if: runner.os == 'Linux'
      - name: Run desktop with Dagger
        env:
          CI_JOB: desktop
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TAG: ${{ steps.vars.outputs.version }}
          ARCHIVE: ${{ steps.vars.outputs.archive }}
          TARGET: ${{ matrix.target }}
        run: bash .dagger/ci.sh "$CI_JOB"
        if: runner.os == 'Linux'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
        if: runner.os != 'Linux'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os != 'Linux'
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: slint-desktop-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: slint-desktop-${{ matrix.target }}-
        if: runner.os != 'Linux'
      - name: Install macOS dependencies
        if: runner.os != 'Linux' && (runner.os == 'macOS')
        run: |
          brew install llvm@21 cmake protobuf
          echo "/opt/homebrew/opt/llvm@21/bin:/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH
      - name: Set Rust flags
        run: echo "RUSTFLAGS=-A warnings" >> $GITHUB_ENV
        if: runner.os != 'Linux'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
        if: runner.os != 'Linux'
      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build
          rm -r node_modules
        if: runner.os != 'Linux'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        if: runner.os != 'Linux'
      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile
        if: runner.os != 'Linux'
      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: |
          bun run build
          rm -r node_modules
        if: runner.os != 'Linux'
      - name: Build headless firmware
        run: bash scripts/build-headless.sh
        if: runner.os != 'Linux'
      - name: Build rockbox-embed
        run: "rm -f target/release/librockbox_embed.a\ncargo build --release --locked -p rockbox-embed\nnm --defined-only\
          \ target/release/librockbox_embed.a 2>/dev/null \\\n  | grep rb_daemon_start \\\n  || { echo \"rb_daemon_start NOT\
          \ in librockbox_embed.a \u2014 abort\"; exit 1; }\n"
        if: runner.os != 'Linux'
      - name: Build librockboxd.a
        run: "rm -f zig/zig-out/lib/librockboxd.a\ncd zig\nzig build lib -Doptimize=ReleaseFast\ncd ..\nnm --defined-only\
          \ zig/zig-out/lib/librockboxd.a 2>/dev/null \\\n  | grep rb_daemon_start \\\n  || { echo \"rb_daemon_start NOT in\
          \ librockboxd.a \u2014 abort\"; exit 1; }\n"
        if: runner.os != 'Linux'
      - name: Build desktop app
        working-directory: desktop
        run: cargo build --release --locked
        if: runner.os != 'Linux'
      - name: Package (macOS .app + .dmg)
        if: runner.os == 'macOS'
        env:
          SKIP_BUILD: '1'
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          bash desktop/package-macos.sh
          mv desktop/dist/Rockbox.dmg "${{ steps.vars.outputs.archive }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vars.outputs.archive }}
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
