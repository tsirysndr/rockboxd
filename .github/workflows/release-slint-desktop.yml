name: release slint desktop app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the archives to"
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Skip SDK / language-binding releases — those tags publish libraries,
    # not the desktop app.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'erlang-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # macOS ships a double-clickable .app inside a .dmg (that is what the
          # homebrew-tap cask installs); Linux ships the binary in a tarball.
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "archive=Rockbox-${VERSION}-${{ matrix.target }}.dmg" >> "$GITHUB_OUTPUT"
          else
            echo "archive=rockbox-desktop-${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: slint-desktop-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: slint-desktop-${{ matrix.target }}-

      # llvm@22 crashes in setSymbolInRelocationInfo on Mach-O — use llvm@21
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 cmake protobuf
          echo "/opt/homebrew/opt/llvm@21/bin:/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libunwind-dev \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            protobuf-compiler \
            curl \
            wget \
            zip \
            unzip \
            cmake

      - name: Set Rust flags
        run: echo "RUSTFLAGS=-A warnings" >> $GITHUB_ENV

      # The web UIs are embedded into rockbox-server, which librockboxd.a
      # links for the in-process daemon.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build
          rm -r node_modules

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile

      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: |
          bun run build
          rm -r node_modules

      # ── Embedded daemon: headless firmware → rockbox-embed → librockboxd.a ─
      - name: Build headless firmware
        run: bash scripts/build-headless.sh

      - name: Build rockbox-embed
        # Drop the archive first so cargo always re-links it from the current
        # deps, then assert the daemon entry point is exported — an embed-side
        # break should fail here, not as an undefined symbol in the desktop
        # link several minutes later.
        run: |
          rm -f target/release/librockbox_embed.a
          cargo build --release --locked -p rockbox-embed
          nm --defined-only target/release/librockbox_embed.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockbox_embed.a — abort"; exit 1; }

      - name: Build librockboxd.a
        # Same staleness defence one layer up. zig/build.zig runs
        # scripts/flatten-archive.sh (both macOS and Linux) which already
        # asserts rb_daemon_start survived the repack; re-checking here keeps
        # the failure visible even if a future build.zig drops that step.
        run: |
          rm -f zig/zig-out/lib/librockboxd.a
          cd zig
          zig build lib -Doptimize=ReleaseFast
          cd ..
          nm --defined-only zig/zig-out/lib/librockboxd.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockboxd.a — abort"; exit 1; }

      # ── Slint desktop app (links librockboxd.a via desktop/build.rs) ──────
      # --locked: the committed lock pins slint-build 1.17.1 (since yanked);
      # a fresh resolution would fail, the locked graph still downloads fine.
      - name: Build desktop app
        working-directory: desktop
        run: cargo build --release --locked

      # Rockbox.app + Rockbox.dmg — icon from the shared appiconset, Info.plist
      # with the Bonjour entries the embedded daemon needs on macOS 15+, ad-hoc
      # signed. SKIP_BUILD: the binary was built in the previous step.
      - name: Package (macOS .app + .dmg)
        if: runner.os == 'macOS'
        env:
          SKIP_BUILD: "1"
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          bash desktop/package-macos.sh
          mv desktop/dist/Rockbox.dmg "${{ steps.vars.outputs.archive }}"

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          STAGE=rockbox-desktop-${{ steps.vars.outputs.version }}-${{ matrix.target }}
          mkdir -p "$STAGE"
          cp desktop/target/release/rockbox-desktop "$STAGE/"
          cp desktop/README.md "$STAGE/"
          cp -r desktop/skins "$STAGE/skins"
          tar -czf "${{ steps.vars.outputs.archive }}" "$STAGE"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.vars.outputs.archive }}
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
