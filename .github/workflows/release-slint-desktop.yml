name: release slint desktop app
'on':
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the archives to
        type: string
        required: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: |-
      github.event_name == 'workflow_dispatch' || (!startsWith(github.event.release.tag_name, 'clojure-v') &&
       !startsWith(github.event.release.tag_name, 'clojure-ffi-v') &&
       !startsWith(github.event.release.tag_name, 'bindings-v') &&
       !startsWith(github.event.release.tag_name, 'elixir-v') &&
       !startsWith(github.event.release.tag_name, 'erlang-v') &&
       !startsWith(github.event.release.tag_name, 'gleam-v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Resolve version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # macOS ships a double-clickable .app inside a .dmg (that is what the
          # homebrew-tap cask installs); Linux ships the binary in a tarball.
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "archive=Rockbox-${VERSION}-${{ matrix.target }}.dmg" >> "$GITHUB_OUTPUT"
          else
            echo "archive=rockbox-desktop-${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Run desktop with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TAG: ${{ steps.vars.outputs.version }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci desktop --source "$GITHUB_WORKSPACE" --platform "$PLATFORM" --tag "$TAG" --output "$GITHUB_WORKSPACE"
        if: runner.os == 'Linux'
      - name: Set up zig
        run: fluentci run setup-zig setup --version 0.16.0 | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: slint-desktop-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: slint-desktop-${{ matrix.target }}-
        if: runner.os != 'Linux'
      - name: Install macOS dependencies
        if: runner.os != 'Linux' && (runner.os == 'macOS')
        run: |
          brew install llvm@21 cmake protobuf
          echo "/opt/homebrew/opt/llvm@21/bin:/usr/local/opt/llvm@21/bin" >> $GITHUB_PATH
      - name: Set Rust flags
        run: echo "RUSTFLAGS=-A warnings" >> $GITHUB_ENV
        if: runner.os != 'Linux'
      - name: Set up deno
        run: fluentci run setup-deno setup --version 2.x | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os != 'Linux'
      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build
          rm -r node_modules
        if: runner.os != 'Linux'
      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile
        if: runner.os != 'Linux'
      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: |
          bun run build
          rm -r node_modules
        if: runner.os != 'Linux'
      - name: Build headless firmware
        run: bash scripts/build-headless.sh
        if: runner.os != 'Linux'
      - name: Build rockbox-embed
        run: |
          rm -f target/release/librockbox_embed.a
          cargo build --release --locked -p rockbox-embed
          nm --defined-only target/release/librockbox_embed.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockbox_embed.a — abort"; exit 1; }
        if: runner.os != 'Linux'
      - name: Build librockboxd.a
        run: |
          rm -f zig/zig-out/lib/librockboxd.a
          cd zig
          zig build lib -Doptimize=ReleaseFast
          cd ..
          nm --defined-only zig/zig-out/lib/librockboxd.a 2>/dev/null \
            | grep rb_daemon_start \
            || { echo "rb_daemon_start NOT in librockboxd.a — abort"; exit 1; }
        if: runner.os != 'Linux'
      - name: Build desktop app
        working-directory: desktop
        run: cargo build --release --locked
        if: runner.os != 'Linux'
      - name: Package (macOS .app + .dmg)
        if: runner.os == 'macOS'
        env:
          SKIP_BUILD: '1'
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          bash desktop/package-macos.sh
          mv desktop/dist/Rockbox.dmg "${{ steps.vars.outputs.archive }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vars.outputs.archive }}
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
