name: linux-x86_64-check
'on':
  push:
    branches:
      - '**'
  pull_request: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-dagger
      - name: Run linux-x86_64-check with Dagger
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        run: dagger --progress logs -v api call -m .dagger/ci linux-check --source . --platform "$PLATFORM" export --path .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-linux-x86_64
          path: |
            target/release/rockbox
            zig/zig-out/bin/rockboxd
