name: ci
on:
  #push:
  #  tags-ignore:
  #    - "clojure-v*"
  #    - "bindings-v*"
  #    - "elixir-v*"
  #    - "gleam-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish"
        type: "string"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libunwind-dev \
            libasound2-dev \
            libdbus-1-dev \
            protobuf-compiler \
            curl \
            wget \
            zip \
            unzip \
            cmake

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zig/.zig-cache
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build Web UI
        run: |
          cd webui/rockbox
          deno install
          deno run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install admin UI dependencies
        working-directory: crates/s3/s3webui
        run: bun install --frozen-lockfile

      - name: Build admin UI
        working-directory: crates/s3/s3webui
        run: bun run build

      - name: Rust flags
        run: echo "RUSTFLAGS=-C target-cpu=x86-64 -A warnings" >> $GITHUB_ENV

      - name: Build rockboxd (headless)
        run: bash scripts/build-headless.sh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build rockbox CLI
        run: cargo build -p rockbox --release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Clean build artifacts
        run: |
          mkdir -p /tmp/rb-bins
          cp target/release/rockbox   /tmp/rb-bins/
          cp zig/zig-out/bin/rockboxd /tmp/rb-bins/
          rm -rf target build-lib build-headless zig/.zig-cache
          mkdir -p target/release zig/zig-out/bin
          mv /tmp/rb-bins/rockbox   target/release/rockbox
          mv /tmp/rb-bins/rockboxd  zig/zig-out/bin/rockboxd

      - name: Determine version
        id: vars
        run: |
          echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Package binaries
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          cp target/release/rockbox .
          cp zig/zig-out/bin/rockboxd .
          tar czvf rockbox_${VERSION}_x86_64-linux.tar.gz rockbox rockboxd
          sha256sum rockbox_${VERSION}_x86_64-linux.tar.gz \
            > rockbox_${VERSION}_x86_64-linux.tar.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rockbox_${{ steps.vars.outputs.version }}_x86_64-linux.tar.gz
            rockbox_${{ steps.vars.outputs.version }}_x86_64-linux.tar.gz.sha256
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
