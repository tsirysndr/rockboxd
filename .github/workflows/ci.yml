name: ci
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish
        type: string
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Determine version
        id: vars
        run: |
          echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
      - name: Run linux-release with FluentCI
        env:
          PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          TAG: ${{ steps.vars.outputs.version }}
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE" --arguments '["--progress","logs","-v","api","call","-m",".dagger/ci","build","--source",".","--platform","$PLATFORM","--tag","$TAG","export","--path","."]'
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rockbox_${{ steps.vars.outputs.version }}_x86_64-linux.tar.gz
            rockbox_${{ steps.vars.outputs.version }}_x86_64-linux.tar.gz.sha256
          tag_name: ${{ steps.vars.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
