# Best-effort build of the full rockboxd binary on FreeBSD and NetBSD
# (amd64 only), using cross-platform-actions VMs. There are no native
# GitHub runners for these platforms, so the whole build runs inside the VM.
#
# The build goes through scripts/build-headless.sh, which needs GNU make
# (gmake), Zig 0.16.0, protobuf (protoc), cmake and the Rust toolchain — so
# this installs more than the FFI-only BSD jobs in bindings-release.yml.
name: bsd-build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-latest
    # A broken toolchain on one BSD shouldn't hide the result on the other,
    # and these are best-effort "does it still build?" checks.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd-amd64
            os: freebsd
            version: "14.2"
          - name: netbsd-amd64
            os: netbsd
            version: "10.1"
    steps:
      # The BSD build runs inside a QEMU VM whose disk is a sparse qcow2 that
      # grows into the host runner's free space. The full Rust workspace +
      # firmware build writes many GB, so reclaim the ~30 GB of preinstalled
      # tooling the ubuntu-latest image ships with, or the guest hits
      # "no space left on device".
      - name: Free up host disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After:"; df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Speed up repeat builds by caching the Rust target/, the cargo registry
      # and the Zig cache. These all live in the working directory (CARGO_HOME
      # is redirected to .cargo-home in the VM run script), so cross-platform-
      # actions rsyncs them into the guest before the build and back out after,
      # and actions/cache saves the updated state at job end. Keyed on
      # Cargo.lock so a dependency change starts fresh; restore-keys lets an
      # older cache seed the build. NOTE: a warm target/ is rsync'd into the
      # tight guest disk — if that reintroduces ENOSPC, drop `target` from the
      # paths below and keep only the registry + zig cache.
      - name: Cache cargo + Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
            zig/.zig-cache
          key: bsd-${{ matrix.name }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bsd-${{ matrix.name }}-build-

      # Both web UIs are embedded into the server crate via rust_embed —
      # webui/src/lib.rs -> rockbox/dist/ and crates/s3/src/admin.rs ->
      # s3webui/dist/. rust_embed errors at compile time if a folder is
      # missing, so both must be built before the native build. bun has no BSD
      # builds, so build them here on the Linux host — cross-platform-actions
      # syncs the working directory (including the freshly built dist/) into
      # the VM.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web UI
        working-directory: webui/rockbox
        run: |
          bun install
          bun run build

      - name: Build S3 admin UI
        working-directory: crates/s3/s3webui
        run: |
          bun install --frozen-lockfile
          bun run build

      # cross-platform-actions rsyncs the whole working directory into the
      # guest, whose disk is tight. Drop everything the BSD build doesn't need:
      #  - web UI node_modules (~1.6 GB) — only the built dist/ is embedded.
      #  - deno test/bench fixtures (~0.9 GB) — the deno submodule is never
      #    compiled on BSD (cargo only reads its manifests for workspace
      #    resolution); wpt/node_compat/cli-bench contain no Cargo.toml, so
      #    removing them keeps resolution working (verified with cargo metadata).
      # Keep .git — the build reads the git ref for the version string.
      - name: Shrink workspace before syncing into the VM
        run: |
          du -sh . 2>/dev/null | awk '{print "workspace before: "$1}'
          rm -rf webui/rockbox/node_modules
          rm -rf crates/s3/s3webui/node_modules
          rm -rf deno/tests/wpt
          rm -rf deno/tests/node_compat
          rm -rf deno/cli/bench
          du -sh . 2>/dev/null | awk '{print "workspace after:  "$1}'

      - name: Build rockboxd in ${{ matrix.os }} VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86_64
          shell: bash
          environment_variables: ZIG_VERSION
          run: |
            set -eux

            ZIG_VERSION=0.16.0

            OS="$(uname)"

            # Trim the guest's target/ footprint (the VM disk is tight): drop
            # debug info and strip symbols from release artifacts.
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_STRIP=symbols

            # Keep the cargo registry/git caches inside the synced working dir
            # so they persist across runs via actions/cache (see the cache step
            # on the host). target/ and zig/.zig-cache are already in-workspace.
            export CARGO_HOME="$PWD/.cargo-home"

            # --- Dependencies -------------------------------------------------
            case "$OS" in
              FreeBSD)
                # xz lives in the FreeBSD base system, so tar handles .tar.xz
                # without a package.
                sudo pkg install -y \
                  bash gcc gmake cmake protobuf rust pkgconf alsa-lib perl5 zip wget
                ;;
              NetBSD)
                # pkgin ships in the cross-platform-actions NetBSD image.
                # gcc and xz are in the NetBSD base system, so no package.
                sudo pkgin -y install \
                  bash gmake cmake protobuf rust pkgconf alsa-lib perl zip wget
                ;;
              *)
                echo "Unsupported OS: $OS" >&2
                exit 1
                ;;
            esac

            # --- perl at /usr/bin/perl ---------------------------------------
            # tools/genlang (and other Rockbox perl tools) have a hardcoded
            # `#!/usr/bin/perl` shebang, but the BSDs install perl under
            # /usr/local/bin (FreeBSD) or /usr/pkg/bin (NetBSD), so the build
            # dies with "genlang: not found" (exit 127). Symlink it into place.
            if [ ! -e /usr/bin/perl ]; then
              sudo ln -sf "$(command -v perl)" /usr/bin/perl
            fi
            /usr/bin/perl --version | head -n2 | tail -n1

            # --- `make` -> gmake shim ----------------------------------------
            # Rockbox's Makefiles are GNU make only; the BSD base `make` fails.
            # build-headless.sh calls `make` literally, so shadow it with gmake.
            mkdir -p "$HOME/bin"
            ln -sf "$(command -v gmake)" "$HOME/bin/make"
            export PATH="$HOME/bin:$PATH"
            make --version | head -n1

            # --- gcc/g++ shims (FreeBSD) -------------------------------------
            # The lang/gcc package installs versioned binaries (gccNN/g++NN)
            # and not always a plain `gcc`. headlesshostcc() uses CC=gcc, so
            # symlink the newest versioned binary to gcc/g++ on PATH.
            if [ "$OS" = "FreeBSD" ] && ! command -v gcc >/dev/null 2>&1; then
              _gcc="$(ls /usr/local/bin/gcc[0-9]* 2>/dev/null | sort -V | tail -n1)"
              _gxx="$(ls /usr/local/bin/g++[0-9]* 2>/dev/null | sort -V | tail -n1)"
              [ -n "$_gcc" ] && ln -sf "$_gcc" "$HOME/bin/gcc"
              [ -n "$_gxx" ] && ln -sf "$_gxx" "$HOME/bin/g++"
            fi
            gcc --version | head -n1

            # --- Zig 0.16.0 ---------------------------------------------------
            # build.zig relies on the 0.16.0 API, so pin the official prebuilt
            # tarball. ziglang.org hosts both freebsd and netbsd x86_64 builds.
            case "$OS" in
              FreeBSD) ZIG_TRIPLE="x86_64-freebsd" ;;
              NetBSD)  ZIG_TRIPLE="x86_64-netbsd" ;;
            esac
            ZIG_TARBALL="zig-${ZIG_TRIPLE}-${ZIG_VERSION}.tar.xz"
            wget -q "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
            tar xf "$ZIG_TARBALL"
            export PATH="$PWD/zig-${ZIG_TRIPLE}-${ZIG_VERSION}:$PATH"
            zig version

            # --- Toolchain sanity --------------------------------------------
            cargo --version
            protoc --version
            cmake --version | head -n1

            # --- Build --------------------------------------------------------
            bash scripts/build-headless.sh

            # --- Result -------------------------------------------------------
            ls -lh zig/zig-out/bin/rockboxd
            file zig/zig-out/bin/rockboxd || true
