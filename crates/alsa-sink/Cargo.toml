[package]
name = "rockbox-alsa-sink"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tracing = { workspace = true }

# libasound ships on Linux and, via the audio/alsa-lib port, on FreeBSD and
# NetBSD. pcm-alsa.c is compiled for ARMHFHOST and the BSD headless targets.
# Gate the dependency so macOS / WASM builds never try to find or link
# libasound (matches the `alsa_backend` cfg from build.rs).
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
alsa = "0.9"
