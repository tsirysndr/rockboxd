[package]
name = "rockbox-dsp"
version = "0.1.0"
description = "Rockbox DSP (EQ, crossfeed, compressor, timestretch, …) as a reusable static library"
authors = { workspace = true }
edition = { workspace = true }
# The compiled C sources are Rockbox firmware code
license = "GPL-2.0-or-later"
repository = { workspace = true }
links = "rockboxdsp"
build = "build.rs"

[build-dependencies]
cc = "1"

[dev-dependencies]
# for examples/play.rs — a minimal symphonia + cpal player with Rockbox EQ
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
