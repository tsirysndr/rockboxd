[package]
name = "rockbox-ffi"
version = "0.3.1"
description = "Flat C ABI over rockbox-dsp + rockbox-metadata + rockbox-playback, for language bindings (Python, TypeScript, Elixir, Gleam, …)"
authors = { workspace = true }
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = { workspace = true }
readme = "README.md"
keywords = ["ffi", "audio", "dsp", "metadata", "rockbox"]
categories = ["multimedia::audio", "external-ffi-bindings"]

[lib]
# staticlib: for embedding; cdylib: for dlopen from Python/TS/BEAM NIFs;
# lib (rlib): so Rust integration tests can call the exported functions.
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["player"]
# The `player` half wraps `rockbox-playback`, which owns a live `cpal`
# output stream and a background engine thread. That needs a real audio
# device, so it is gated off for targets without one (e.g. the browser /
# `wasm32-unknown-emscripten`, where JS + Web Audio drive playback and only
# the decode + DSP + metadata surface is compiled in).
player = ["dep:rockbox-playback"]

[dependencies]
rockbox-codecs = { version = "0.2.1", path = "../rockbox-codecs" }
rockbox-dsp = { version = "0.3.0", path = "../rockbox-dsp" }
rockbox-metadata = { version = "0.1.0", path = "../rockbox-metadata" }
rockbox-playback = { version = "0.6.0", path = "../rockbox-playback", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
