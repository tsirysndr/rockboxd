syntax = "proto3";

package rockbox.v1alpha1;

message Track {
  string id = 1;
  string path = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  string album_artist = 6;
  uint32 bitrate = 7;
  string composer = 8;
  uint32 disc_number = 9;
  uint32 filesize = 10;
  uint32 frequency = 11;
  uint32 length = 12;
  uint32 track_number = 13;
  uint32 year = 14;
  string year_string = 15;
  string genre = 16;
  string md5 = 17;
  optional string album_art = 18;
  optional string artist_id = 19;
  optional string album_id = 20;
  optional string genre_id = 21;
  string created_at = 22;
  string updated_at = 23;
}

message Artist {
  string id = 1;
  string name = 2;
  optional string bio = 3;
  optional string image = 4;
  repeated Album albums = 5;
  repeated Track tracks = 6;
  optional string genres = 7;
}

message Album {
  string id = 1;
  string title = 2;
  string artist = 3;
  uint32 year = 4;
  string year_string = 5;
  optional string album_art = 6;
  string md5 = 7;
  string artist_id = 8;
  optional string label = 9;
  optional string copyright_message = 10;
  repeated Track tracks = 11;
}

message GetAlbumRequest {
  string id = 1;
}

message GetAlbumResponse {
  optional Album album = 1;
}

message GetArtistRequest {
  string id = 1;
}

message GetArtistResponse {
  optional Artist artist = 1;
}

message GetTrackRequest {
  string id = 1;
}

message GetTrackResponse {
  optional Track track = 1;
}

message GetAlbumsRequest {}

message GetAlbumsResponse {
  repeated Album albums = 1;
}

message GetArtistsRequest {}

message GetArtistsResponse {
  repeated Artist artists = 1;
}

message GetTracksRequest {}

message GetTracksResponse {
  repeated Track tracks = 1;
}

message LikeTrackRequest {
  string id = 1;
}

message LikeTrackResponse {}

message LikeAlbumRequest {
  string id = 1;
}

message LikeAlbumResponse {}

message UnlikeTrackRequest {
  string id = 1;
}

message UnlikeTrackResponse {}

message UnlikeAlbumRequest {
  string id = 1;
}

message UnlikeAlbumResponse {}

message GetLikedTracksRequest {}

message GetLikedTracksResponse {
  repeated Track tracks = 1;
}

message GetLikedAlbumsRequest {}

message GetLikedAlbumsResponse {
  repeated Album albums = 1;
}

message ScanLibraryRequest {
  optional string path = 1;
  optional bool rebuild_index = 2;
}

message ScanLibraryResponse {}

message StreamLibraryRequest {}

message StreamLibraryResponse {}

message SearchRequest {
  string term = 1;
}

message SearchPlaylist {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string image = 4;
  bool is_smart = 5;
  int64 track_count = 6;
}

message SearchResponse {
  repeated Track tracks = 1;
  repeated Album albums = 2;
  repeated Artist artists = 3;
  repeated SearchPlaylist playlists = 4;
}

// Advanced filters reuse the same JSON-encoded RuleCriteria shape used by
// smart playlists. The filter is applied to the underlying tracks; matching
// albums / artists are the ones whose tracks pass the filter.
message FilterAlbumsRequest {
  string rules_json = 1;
}

message FilterAlbumsResponse {
  repeated Album albums = 1;
}

message FilterArtistsRequest {
  string rules_json = 1;
}

message FilterArtistsResponse {
  repeated Artist artists = 1;
}

service LibraryService {
  rpc GetAlbums(GetAlbumsRequest) returns (GetAlbumsResponse);
  rpc GetArtists(GetArtistsRequest) returns (GetArtistsResponse);
  rpc GetTracks(GetTracksRequest) returns (GetTracksResponse);
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse);
  rpc GetArtist(GetArtistRequest) returns (GetArtistResponse);
  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse);
  rpc LikeTrack(LikeTrackRequest) returns (LikeTrackResponse);
  rpc UnlikeTrack(UnlikeTrackRequest) returns (UnlikeTrackResponse);
  rpc LikeAlbum(LikeAlbumRequest) returns (LikeAlbumResponse);
  rpc UnlikeAlbum(UnlikeAlbumRequest) returns (UnlikeAlbumResponse);
  rpc GetLikedTracks(GetLikedTracksRequest) returns (GetLikedTracksResponse);
  rpc GetLikedAlbums(GetLikedAlbumsRequest) returns (GetLikedAlbumsResponse);
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse);
  rpc StreamLibrary(StreamLibraryRequest) returns (stream StreamLibraryResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc FilterAlbums(FilterAlbumsRequest) returns (FilterAlbumsResponse);
  rpc FilterArtists(FilterArtistsRequest) returns (FilterArtistsResponse);
  // rules_json is a JSON RuleCriteria; set its `rsql` field for expression
  // filters ("genre==rock;playcount>5") — same body FilterAlbums accepts.
  rpc FilterTracks(FilterTracksRequest) returns (FilterTracksResponse);
  // Listening analytics — projections of track_stats and the play_history log.
  rpc MostPlayed(AnalyticsPageRequest) returns (TrackStatListResponse);
  rpc MostSkipped(AnalyticsPageRequest) returns (TrackStatListResponse);
  rpc NeverPlayed(AnalyticsPageRequest) returns (TrackStatListResponse);
  rpc RecentlyAdded(AnalyticsPageRequest) returns (TrackStatListResponse);
  rpc RecentlyPlayed(AnalyticsPageRequest) returns (PlayHistoryResponse);
}

message FilterTracksRequest {
  string rules_json = 1;
}

message FilterTracksResponse {
  repeated Track tracks = 1;
}

message AnalyticsPageRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
}

message TrackStat {
  string track_id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  // play_count for MostPlayed, skip_count for MostSkipped, 0 otherwise.
  int64 count = 5;
  // last_played / last_skipped, unix seconds; absent where meaningless.
  optional int64 at = 6;
  // ISO timestamp for the added views.
  optional string created_at = 7;
}

message TrackStatListResponse {
  repeated TrackStat stats = 1;
}

message PlayHistoryEntry {
  string track_id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  int64 played_at = 5;
  int64 ms_played = 6;
  int64 length_ms = 7;
  bool skipped = 8;
}

message PlayHistoryResponse {
  repeated PlayHistoryEntry entries = 1;
}
