[package]
name = "rockbox-playback"
version = "0.4.2"
description = "Audio playback engine over rockbox-codecs + rockbox-dsp + cpal — native ReplayGain and Rockbox crossfade"
authors = { workspace = true }
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = { workspace = true }
readme = "README.md"
keywords = ["audio", "player", "playback", "crossfade", "rockbox"]
categories = ["multimedia::audio"]

[features]
default = ["http"]
# HTTP(S) remote media support: stream/decode `http(s)://` URLs via ranged
# requests, backed by `reqwest`. Disable for a leaner, local-file-only build.
http = ["dep:reqwest", "dep:tempfile"]

[dependencies]
rockbox-metadata = { version = "0.1.0", path = "../rockbox-metadata" }
rockbox-codecs = { version = "0.2.1", path = "../rockbox-codecs" }
rockbox-dsp = { version = "0.3.0", path = "../rockbox-dsp" }
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls-native-roots",
], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
