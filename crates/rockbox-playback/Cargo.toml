[package]
name = "rockbox-playback"
version = "0.1.1"
description = "Audio playback engine over rockbox-codecs + rockbox-dsp + cpal — native ReplayGain and Rockbox crossfade"
authors = { workspace = true }
edition = { workspace = true }
license = "GPL-2.0-or-later"
repository = { workspace = true }
readme = "README.md"
keywords = ["audio", "player", "playback", "crossfade", "rockbox"]
categories = ["multimedia::audio"]

[dependencies]
rockbox-metadata = { version = "0.1.0", path = "../rockbox-metadata" }
rockbox-codecs = { version = "0.1.2", path = "../rockbox-codecs" }
rockbox-dsp = { version = "0.2.0", path = "../rockbox-dsp" }
cpal = "0.15"

[dev-dependencies]
