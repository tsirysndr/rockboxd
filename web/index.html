<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockbox WASM — decode + DSP core</title>

<!-- UI: Outfit + Lexend. Numerics: JetBrains Mono. Cross-origin fonts load
     because the dev server sends COEP: credentialless. Fallbacks keep the
     page readable if the fonts are blocked. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --font-ui:   'Lexend', system-ui, sans-serif;
    --font-head: 'Outfit', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --bg:      #0d0f14;
    --panel:   #161a22;
    --panel-2: #1e232e;
    --line:    #2a303c;
    --text:    #e7ebf2;
    --muted:   #8b93a5;
    --accent:  #5b8cff;
    --accent-2:#7c5cff;
    --ok:      #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2030 0%, var(--bg) 60%);
    color: var(--text); font-family: var(--font-ui); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-family: var(--font-head); font-weight: 700; letter-spacing: -.02em;
    font-size: 1.9rem; margin: 0 0 .15rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.4rem; }
  h2 {
    font-family: var(--font-head); font-weight: 600; font-size: 1rem;
    margin: 0 0 .9rem; color: var(--text); letter-spacing: -.01em;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 1.2rem 1.3rem; margin-bottom: 1.1rem;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  #log {
    font-family: var(--font-mono); font-size: .8rem; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: .5rem .7rem; margin-bottom: 1.1rem;
    white-space: pre-wrap;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input[type=url], input[type=text] {
    flex: 1 1 240px; min-width: 0; padding: .6rem .8rem; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    font-family: var(--font-ui); font-size: .9rem;
  }
  input[type=url]:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    font-family: var(--font-ui); font-weight: 500; font-size: .88rem;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: .55rem .8rem; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: #232a37; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; font-weight: 600;
  }
  .transport button { min-width: 3rem; font-size: 1.05rem; }
  .now { margin: 1rem 0 .3rem; }
  #track-title { font-family: var(--font-head); font-weight: 600; font-size: 1.15rem; }
  #track-artist { color: var(--muted); font-size: .9rem; }
  #track-meta  { color: var(--muted); font-family: var(--font-mono); font-size: .72rem; margin-top: .2rem; }
  .seek { display: flex; align-items: center; gap: .6rem; margin: .8rem 0 .2rem; }
  .seek .t { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); min-width: 3.2rem; }
  .seek .t.right { text-align: right; }
  .seek .t.live { color: #ff4d5e; font-weight: 600; letter-spacing: .06em; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px;
    background: var(--line); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fff; }
  input[type=range]:disabled { opacity: .5; }
  .seek input[type=range] { flex: 1; }
  .status-line { display: flex; align-items: center; gap: .6rem; margin-top: .6rem; }
  .pill { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
    padding: .2rem .55rem; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .pill.playing { color: var(--ok); border-color: var(--ok); }
  #queue-info { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
  .vol { display: flex; align-items: center; gap: .6rem; margin-top: .8rem; }
  .vol label { font-size: .85rem; color: var(--muted); }
  .vol .val { font-family: var(--font-mono); font-size: .78rem; color: var(--text); min-width: 3rem; text-align: right; }

  /* Settings */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1.4rem; }
  .field { display: flex; flex-direction: column; gap: .3rem; }
  .field > .lbl { font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; }
  .field .val { font-family: var(--font-mono); color: var(--text); }
  select { font-family: var(--font-ui); background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: .4rem .5rem; font-size: .85rem; }
  .switch { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }
  .full { grid-column: 1 / -1; }
  .divider { height: 1px; background: var(--line); margin: 1.1rem 0; grid-column: 1/-1; }

  /* EQ bands */
  .eq-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
  .eq-bands { display: flex; justify-content: space-between; gap: .3rem; }
  .eq-band { display: flex; flex-direction: column; align-items: center; gap: .4rem; flex: 1; }
  .eq-band input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 6px; height: 110px; }
  .eq-band .hz   { font-family: var(--font-mono); font-size: .62rem; color: var(--muted); }
  .eq-band .gain { font-family: var(--font-mono); font-size: .66rem; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Rockbox WASM</h1>
  <p class="sub">Decode + DSP core (<span style="font-family:var(--font-mono)">rockbox-codecs · rockbox-dsp · rockbox-metadata</span>) — the player runs in JavaScript.</p>

  <div id="log">Initialising…</div>

  <!-- ── Player ─────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="row">
      <input id="url-input" type="url" placeholder="https://…/song.flac  (or a file served from web/)"
             value="">
      <button id="btn-play-url" class="primary">Play</button>
      <button id="btn-enqueue">+ Queue</button>
    </div>

    <div class="now">
      <div id="track-title">—</div>
      <div id="track-artist"></div>
      <div id="track-meta"></div>
    </div>

    <div class="seek">
      <span class="t" id="elapsed">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled>
      <span class="t right" id="duration">0:00</span>
    </div>

    <div class="row transport" style="justify-content:center; margin-top:.4rem;">
      <button id="btn-prev"  disabled>⏮</button>
      <button id="btn-play"  disabled>▶</button>
      <button id="btn-next"  disabled>⏭</button>
      <button id="btn-stop"  disabled>⏹</button>
      <button id="btn-shuffle" disabled title="Shuffle">🔀</button>
      <button id="btn-repeat"  disabled title="Repeat: off">🔁</button>
      <button id="btn-clear"   disabled>✕ Clear</button>
    </div>

    <div class="status-line">
      <span class="pill" id="status-pill">stopped</span>
      <span id="queue-info"></span>
    </div>

    <div class="vol">
      <label>Volume</label>
      <input id="vol" type="range" min="0" max="100" value="100" step="1" disabled style="flex:1">
      <span class="val" id="vol-val">100%</span>
    </div>
  </div>

  <!-- ── Equalizer ──────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="eq-head">
      <h2 style="margin:0">Equalizer</h2>
      <label class="switch"><input id="eq-enabled" type="checkbox" disabled> enabled</label>
    </div>
    <div class="eq-bands" id="eq-bands"><!-- filled by JS --></div>
    <div class="field" style="margin-top:1rem">
      <div class="lbl"><span>Pre-cut</span><span class="val" id="eq-precut-val">0.0 dB</span></div>
      <input id="eq-precut" type="range" min="0" max="240" value="0" step="5" disabled>
    </div>
  </div>

  <!-- ── DSP config ─────────────────────────────────────────────────────── -->
  <div class="card">
    <h2>DSP</h2>
    <div class="grid">
      <div class="field">
        <div class="lbl"><span>Bass</span><span class="val" id="bass-val">0 dB</span></div>
        <input id="bass" type="range" min="-24" max="24" value="0" step="1" disabled>
      </div>
      <div class="field">
        <div class="lbl"><span>Treble</span><span class="val" id="treble-val">0 dB</span></div>
        <input id="treble" type="range" min="-24" max="24" value="0" step="1" disabled>
      </div>

      <div class="divider"></div>

      <div class="field">
        <div class="lbl"><span>ReplayGain</span></div>
        <select id="rg-mode" disabled>
          <option value="3">Off</option>
          <option value="0">Track</option>
          <option value="1">Album</option>
          <option value="2">Shuffle</option>
        </select>
      </div>
      <div class="field">
        <div class="lbl"><span>Pre-amp</span><span class="val" id="rg-preamp-val">0.0 dB</span></div>
        <input id="rg-preamp" type="range" min="-120" max="120" value="0" step="5" disabled>
      </div>
      <label class="switch full"><input id="rg-noclip" type="checkbox" disabled> Prevent clipping</label>

      <div class="divider"></div>

      <div class="field">
        <div class="lbl"><span>Channel mode</span></div>
        <select id="channel-mode" disabled>
          <option value="0">Stereo</option>
          <option value="1">Mono</option>
          <option value="2">Custom</option>
          <option value="3">Mono left</option>
          <option value="4">Mono right</option>
          <option value="5">Karaoke</option>
          <option value="6">Swap</option>
        </select>
      </div>
      <div class="field">
        <div class="lbl"><span>Stereo width</span><span class="val" id="width-val">100%</span></div>
        <input id="width" type="range" min="0" max="255" value="100" step="1" disabled>
      </div>
    </div>
  </div>

</div>

<script type="module">
import { RockboxPlayer } from './rockbox.js';

const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent = m; };
const fmt = (ms) => {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

const player = new RockboxPlayer();
const CUTOFFS = RockboxPlayer.EQ_BAND_CUTOFFS;
let seeking = false;
let repeatMode = 0;
const REPEAT_ICONS  = ['🔁', '🔂', '🔁'];     // off / one / all
const REPEAT_TITLES = ['Repeat: off', 'Repeat: one', 'Repeat: all'];

// ── Build EQ band sliders ────────────────────────────────────────────────
const eqBands = $('eq-bands');
CUTOFFS.forEach((hz, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'eq-band';
  const label = hz >= 1000 ? `${hz / 1000}k` : `${hz}`;
  wrap.innerHTML =
    `<span class="gain" id="eqg-${i}">0</span>` +
    `<input id="eq-${i}" type="range" min="-24" max="24" value="0" step="1" disabled>` +
    `<span class="hz">${label}</span>`;
  eqBands.appendChild(wrap);
  wrap.querySelector('input').addEventListener('input', (e) => {
    const gain = +e.target.value;
    $(`eqg-${i}`).textContent = gain;
    // Fixed musical Q of 1.0 per band; cutoff is the band's centre frequency.
    player.setEqBand(i, hz, 1.0, gain);
    if (!$('eq-enabled').checked) { $('eq-enabled').checked = true; player.setEqEnabled(true); }
  });
});

// ── Boot on first interaction (AudioContext needs a user gesture) ─────────
async function boot() {
  try {
    log('Starting audio engine…');
    await player.init();
    enableUI();
    log('Ready. Paste an audio URL and press Play.');
  } catch (err) {
    log('Init failed: ' + err.message);
    throw err;
  }
}
function enableUI() {
  document.querySelectorAll('button, input, select').forEach((el) => { el.disabled = false; });
}

// ── Transport wiring ──────────────────────────────────────────────────────
// Boot exactly once, on the first Play/Queue click (AudioContext + the whole
// audio graph need a user gesture). Retry on failure; ignore concurrent calls.
let bootPromise = null;
function ensureBooted() { return (bootPromise ??= boot().catch((e) => { bootPromise = null; throw e; })); }

// Friendly starting message (nothing is actually initialising until you click).
log('Ready — paste an audio URL and press Play.');

$('btn-play-url').addEventListener('click', async () => {
  await ensureBooted();
  const url = $('url-input').value.trim();
  if (url) player.setQueue([url], true);
});
$('btn-enqueue').addEventListener('click', async () => {
  await ensureBooted();
  const url = $('url-input').value.trim();
  if (url) player.enqueue(url);
});
$('btn-play').addEventListener('click', async () => { await ensureBooted(); player.toggle(); });
$('btn-prev').addEventListener('click', () => player.prev());
$('btn-next').addEventListener('click', () => player.next());
$('btn-stop').addEventListener('click', () => player.stop());
$('btn-clear').addEventListener('click', () => player.clearQueue());
$('btn-shuffle').addEventListener('click', (e) => {
  const on = !e.target.classList.contains('primary');
  e.target.classList.toggle('primary', on);
  player.setShuffle(on);
});
$('btn-repeat').addEventListener('click', (e) => {
  repeatMode = (repeatMode + 1) % 3;
  e.target.textContent = REPEAT_ICONS[repeatMode];
  e.target.title = REPEAT_TITLES[repeatMode];
  e.target.classList.toggle('primary', repeatMode !== 0);
  player.setRepeat(repeatMode);
});

// Seek slider (0..1000 → fraction of duration)
$('seek').addEventListener('input', () => { seeking = true; });
$('seek').addEventListener('change', (e) => {
  const dur = player.progress.duration_ms || 0;
  if (dur > 0) player.seek((+e.target.value / 1000) * dur);
  seeking = false;
});

// Volume
$('vol').addEventListener('input', (e) => {
  const v = +e.target.value;
  $('vol-val').textContent = v + '%';
  player.setVolume(v / 100);
});

// ── DSP controls ──────────────────────────────────────────────────────────
$('eq-enabled').addEventListener('change', (e) => player.setEqEnabled(e.target.checked));
$('eq-precut').addEventListener('input', (e) => {
  const tenths = +e.target.value;
  $('eq-precut-val').textContent = (tenths / 10).toFixed(1) + ' dB';
  player.setEqPrecut(tenths / 10);
});
const bassEl = $('bass'), trebEl = $('treble');
function applyTone() {
  $('bass-val').textContent   = bassEl.value + ' dB';
  $('treble-val').textContent = trebEl.value + ' dB';
  player.setTone(+bassEl.value, +trebEl.value);
}
bassEl.addEventListener('input', applyTone);
trebEl.addEventListener('input', applyTone);

function applyReplaygain() {
  const mode = +$('rg-mode').value;
  const preamp = +$('rg-preamp').value / 10;
  $('rg-preamp-val').textContent = preamp.toFixed(1) + ' dB';
  player.setReplaygain(mode, $('rg-noclip').checked, preamp);
}
$('rg-mode').addEventListener('change', applyReplaygain);
$('rg-preamp').addEventListener('input', applyReplaygain);
$('rg-noclip').addEventListener('change', applyReplaygain);

$('channel-mode').addEventListener('change', (e) => player.setChannelMode(+e.target.value));
$('width').addEventListener('input', (e) => {
  $('width-val').textContent = e.target.value + '%';
  player.setStereoWidth(+e.target.value);
});

// ── Player events → UI ─────────────────────────────────────────────────────
player.on('track', (m) => {
  const md = m.metadata || {};
  const fallback = decodeURIComponent(m.url.split('/').pop() || '') || 'Unknown';
  $('track-title').textContent  = md.title || (m.live ? new URL(m.url).host : fallback);
  $('track-artist').textContent = m.live ? 'Live stream'
                                         : [md.artist, md.album].filter(Boolean).join(' — ');
  const bits = [md.codec, md.sample_rate && `${(md.sample_rate / 1000).toFixed(1)} kHz`,
                md.bitrate && `${md.bitrate} kbps`].filter(Boolean);
  $('track-meta').textContent = bits.join('  ·  ');
});

player.on('progress', (p) => {
  $('elapsed').textContent = fmt(p.elapsed_ms);
  if (p.live) {
    // Infinite stream: no timeline. Show a LIVE badge and lock the seek bar full.
    $('duration').textContent = 'LIVE';
    $('duration').classList.add('live');
    $('seek').value = 1000;
    $('seek').disabled = true;
  } else {
    $('duration').textContent = fmt(p.duration_ms);
    $('duration').classList.remove('live');
    $('seek').disabled = false;
    if (!seeking) {
      const frac = p.duration_ms > 0 ? p.elapsed_ms / p.duration_ms : 0;
      $('seek').value = Math.round(frac * 1000);
    }
  }
});

player.on('status', (s) => {
  const pill = $('status-pill');
  pill.textContent = s.state;
  pill.classList.toggle('playing', s.state === 'playing');
  $('btn-play').textContent = s.state === 'playing' ? '⏸' : '▶';
  $('queue-info').textContent = s.queue_len
    ? `${(s.index + 1)} / ${s.queue_len} in queue` : 'queue empty';
});

player.on('error', (e) => log('⚠ ' + e.message));
</script>
</body>
</html>
